<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Javascript no html</title>
</head>
<body>
    <!-- É possivel usar javascript diretamente em elementos html como abaixo: -->
     <button onClick="alert('Ola mundo')">Aperte</button>
     <!-- Esse é o metodo javascript inline, onde o codigo javascript é passado diretamente como valor aos elementos html 
    o atributo onClick que é um evento no html de click, faz com que quando o elemento button é clicado 
    ele executara o comando javascript: alert('ola mundo')
    esse comando executara a mensagem 'ola mundo' numa caixa de texto no navegador -->
</body>
</html>
