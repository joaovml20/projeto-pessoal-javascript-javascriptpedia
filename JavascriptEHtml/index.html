<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site De Exemplo</title>
</head>
<body>
    <h1 id="titulo">Site de Exemplo</h1>

    <p class="paragrafo">Sou o primeiro parágrafo</p>
    <p class="paragrafo">Sou o segundo parágrafo</p>
    <p class="paragrafo">Sou o terceiro parágrafo</p>

    <div><p>Estou dentro de uma div</p></div>
    <div><p>Estou também</p></div>
    <div><p>Eu também estou numa div</p></div>

    <script>
        //aqui é onde o javascript trabalhara com o html através do método interno
        // para saber outros meios, verifique na pasta: estruturabasica

        // o comando abaixo, declara uma constante que se vincula a uma tag html através do id
        // no caso abaixo, a variável título se vincular a tag h1 do html com id "titulo"
        const titulo = document.getElementById('titulo')
        console.log(titulo.textContent)
        // onde 'document' se refere a pagina do html em si e apos ele(getElementById()) é o método
        // que buscara a tag através do id nesse caso
        // no caso acima, console.log irá imprimir o texto da tag cuja variável titulo esta vinculada
        // nesse caso, a tag h1 contem o texto "Site De Exemplo" e isso é o que console.log imprimira

        // uma forma de vincular uma variável a vários elementos html é através das class das tags
        // o método "document.getElementsByClassName()" é semelhante ao "document.getElementById()"
        // porém ao invés de fazer a vinculação por id da tag, faz por class da tag, ou seja
        // se varias tags html tiveram o mesmo atributo class, a variável se vinculara a essas tags
        // com o mesmo atributo, um exemplo abaixo:
        const paragrafos = document.getElementsByClassName('paragrafo')
        console.log(paragrafos)
        // acima, a variável paragrafos se vincular as tags p do html cujo tem a class 'paragrafo'
        // e console.log irá imprimir essas tags
        // cabe ressaltar que a constante paragrafos através desse método
        // tem uma HTMLCollection, que resumidamente, é como se fosse um vetor/array de elementos html
        // que podem ser acessados por indices como os vetores e se auto atualizam conforme o DOM
        // por exemplo, se uma nova tag html receber a classe "paragrafo", ela será vinculada
        // a variável paragrafos automaticamente e se uma tag deixar de ter classe "paragrafo"
        // ela será removida automaticamente desse vetor de tags html

        // se necessário vincular uma variável a todos os elementos com a mesma tag independente do id e da class
        // o método getElementsByTagName ajudaria nesse caso
        // um exemplo abaixo
        const divs = document.getElementsByTagName('div')
        console.log(divs)
        // a constante divs agora faz referência a todas as tags div do document(html)
        // assim como getElementsByClassName, o método getElementsByTagName também
        // retornara um HTMLCollection
    </script>
</body>
</html>
