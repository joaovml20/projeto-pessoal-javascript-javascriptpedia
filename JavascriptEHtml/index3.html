<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site De Exemplo</title>
</head>
<body>

    <script>
        //aqui é onde o javascript trabalhara com o html através do método interno
        // para saber outros meios, verifique na pasta: estruturabasica

        // Para criar elementos html do zero com javascript, utiliza-se método createElement
        // onde se deve passar para ele apenas o nome da tag html
        // um exemplo abaixo:
        const novoElemento = document.createElement('p')
        // acima uma tag html p é criada com javascript, agora é possível modificar a suas
        // características como visto nos códigos nos arquivos index.html e index2.html
        // nesta mesma pasta
        // um exemplo
        novoElemento.textContent = "Sou um elemento criado com js"
        novoElemento.id = 'p1'
        novoElemento.className = 'paragrafo'
        // acima, o elemento recebeu um texto, um id e uma classe respetivamente
        // também é possível fazer isso usando o setAttribute como visto nos códigos nos arquivos
        // index.html e index2.html nesta mesma pasta
        // também visto nos códigos dos arquivos anteriores, a modificação de css
        // um exemplo abaixo
        novoElemento.style.color = 'red'
        novoElemento.style.background = 'black'
        novoElemento.style.padding = '10px'
        novoElemento.style.margin = '10px'
        // acima, o elemento criada anteriormente com js, tem o seu css modificado
        // o fazendo ter o seu texto na cor vermelho, com fundo preto e margin e padding
        // com 10 pixels
    </script>
</body>
</html>
