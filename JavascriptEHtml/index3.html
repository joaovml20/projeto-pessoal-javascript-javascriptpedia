<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site De Exemplo</title>
</head>
<body>

    <ul id="lista">
        <li id="item1">Item 1</li>
        <li id="item2">Item 2</li>
    </ul>

    <script>
        //aqui é onde o javascript trabalhara com o html através do método interno
        // para saber outros meios, verifique na pasta: estruturabasica

        // Para criar elementos html do zero com javascript, utiliza-se método createElement
        // onde se deve passar para ele apenas o nome da tag html
        // um exemplo abaixo:
        const novoElemento = document.createElement('p')
        // acima uma tag html p é criada com javascript, agora é possível modificar a suas
        // características como visto nos códigos nos arquivos index.html e index2.html
        // nesta mesma pasta
        // um exemplo
        novoElemento.textContent = "Sou um elemento criado com js"
        novoElemento.id = 'p1'
        novoElemento.className = 'paragrafo'
        // acima, o elemento recebeu um texto, um id e uma classe respetivamente
        // também é possível fazer isso usando o setAttribute como visto nos códigos nos arquivos
        // index.html e index2.html nesta mesma pasta
        // também visto nos códigos dos arquivos anteriores, a modificação de css
        // um exemplo abaixo
        novoElemento.style.color = 'red'
        novoElemento.style.background = 'black'
        novoElemento.style.padding = '10px'
        novoElemento.style.margin = '10px'
        // acima, o elemento criada anteriormente com js, tem o seu css modificado
        // o fazendo ter o seu texto na cor vermelho, com fundo preto e margin e padding
        // com 10 pixels
        // até o momento, a tag foi criada e não foi adicionado ao DOM, para ela ser exibida no html
        // use-se o método appendChild
        // sua sintaxe consiste primeiro no nó html ou resumidamente na tag que ele será adicionado como
        // filho dessa tag, o também chamado parentNode, depois passar o appendChild e após ele
        // entre parênteses passa tag que será adicionar que no caso é uma variável com uma tag criada
        // com javascript, também chamado nesse caso de childNode
        // um exemplo abaixo:
        document.body.appendChild(novoElemento)
        // acima, é acessado o DOM(document) depois a tag que será pai do elemento(body), após
        // o método appendChild com a tag armazenada na variável
        // assim, será adicionado a tag ao final da tag body como filho
        // para ter mais controle onde os elementos criados serão inseridos, usar-se o método insertBefore
        // ele assim como appendChild vai precisar de um elemento pai(parentNode), a tag para inserir
        // que nesse caso chama-se de newNode, e uma informação extra, a tag antes dele para inserir
        // chamada de referenceNode, ambas dentro de parênteses e separada por virgula sendo passadas
        // para insertBefore
        // se referenceNode for null, insertBefore funcionará como
        // appendChild, e adicionará ao final parentNode e não antes do referenceNode
        // um exemplo abaixo
        const lista = document.getElementById('lista')
        const item2 = document.getElementById('item2')
        const itemNovo = document.createElement('li')
        itemNovo.textContent = "Sou um item criado com js"
        lista.insertBefore(itemNovo,item2)
        // acima é criada as variáveis e vinculadas as tags do html com excessão do itemNovo, que é
        // um novo elemento criado aparti de js, que em seguida recebe um texto e por fim, é adicionado
        // como filho a tag vinculada a variável lista e antes da tag vinculada a variável item2
    </script>
</body>
</html>
