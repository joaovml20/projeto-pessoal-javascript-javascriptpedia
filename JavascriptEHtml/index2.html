<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de exemplo 2</title>
</head>
<body>
    <div id="div">
        <p>Sou um parágrafo</p>
        Sou um parágrafo sem tag
        <p>Sou outro parágrafo</p>
    </div>

    <h1 id="h1"> Sou uma tag H1</h1>
    <h2 id="h2"> Sou uma tag H2</h2>

    <p id="par">Sou um parágrafo com id modificado</p>

    <p id="par2" class="paragrafo">Sou uma tag com class</p>

    <p id="par3">Sou uma tag sem id</p>

    <p id="par4">Sou uma tag com uma cor diferente</p>

    <p id="par5">Sou uma tag com uma cor diferente através de setAttribute</p>

    <script>
        
        //aqui é onde o javascript trabalhara com o html através do método interno
        // para saber outros meios, verifique na pasta: estruturabasica

        // abaixo a declaração de uma variável através do id
        // que após isso, verificar a quantidade de "filhos" da tag/variável
        const divHtml = document.getElementById('div');
        console.log(divHtml.children.length);
        // acima a propriedade "children" retornar os filhos da variável que
        // nada mais são que as tags dentro da propria tag a propriedade "length"
        // retorna o tamanho/quantidade de filhos em número, nesse caso
        // como a variável divHtml só tem duas tags dentro dela
        // será retornado 2
        // cabe resaltar que childen retorna um HTMLCollection

        // Para acessar ou modificar uma tag html através do javascript
        // basta vincular a tag a uma variável js como visto no arquivo index.html anteriormente
        // após isso, existe, por exemplo, a propriedade innerHTMl que modificar a tag completamente
        // um exemplo abaixo
        const h1 = document.getElementById('h1');
        h1.innerHTML = '<p>Agora sou uma tag p</p>'
        // acima a tag h1 vinculada a variável h1 tem o seu html completamente modificado pelo innerHTMl
        // e assim, a tag h1 passa a ser uma tag p com outro texto
        // para modificar somente o texto da tag, bastar usar a propriedade textContent
        // um exemplo abaixo
        const h2 = document.getElementById('h2');
        h2.textContent = 'Agora sou uma tag H2 com um novo texto';
        // acima, somente foi modificado o texto da tag h2 via variável js(javascript)

        // para manipular apenas os atributos das tags como id,class,src e etc via javascript, basta usar
        // o método setAttribute
        // um exemplo abaixo
        const p1 = document.getElementById('par');
        p1.setAttribute('id','para1')
        // no exemplo acima, a tag vinculada a constante p1, tem o seu id modificado para 'para1'
        // observe que setAttribute recebe primeiro o atributo com aspas simples que nesse caso foi id
        // e depois o valor desse atributo também com aspas simples que nesse caso foi para1
        // e assim, foi adicionado um novo id ao elemento
        // para apenas acessar o valor de um atributo de uma tag, bastar usar o método getAttribute
        // passando para ele, apenas o atributo
        // um exemplo abaixo:
        const p2 = document.getElementById('par2');
        let classDep2 = p2.getAttribute('class');
        console.log (classDep2);
        // no exemplo acima, getAttribute retornar o valor do atributo class do elemento p2
        // que então é armazenado na variável classDep2 e exibido no console.log que nesse caso
        // é paragrafo
        // e para remover um atributo de uma tag com js, use o método removeAttribute
        // passando para ele apenas o atributo a ser removido
        // um exemplo abaixo:
        const p3 = document.getElementById('par3');
        p3.removeAttribute('id')
        // no exemplo acima, a tag vinculada a variável p3, tem sem id removido

        // É possível ainda modificar o css de um elemento html através da propriedade style
        // que através dessa propriedade, é possível acessar as propriedades de estilos
        // Um exemplo abaixo
        const p4 = document.getElementById('par4');
        p4.style.color = 'red';
        // acima a tag html vinculada a variável p4, tem a sua cor alterada para vermelho
        // através da propriedade style que por sua vez, acessar a propriedade de estilo color
        // que então recebe a cor vermelha e é modificada
        // style pode dar acesso outras propriedades como mudar o tamanho da fonte através do fontSize
        // para isso, é necessário conhecimento de css
        // ainda usando a variável p4, é possível ainda dá a ela classes css através da propriedade classList
        // seguido da propriedade add e passando entre parênteses, o nome da classe css
        // lembre-se que após passar o nome da classe, ela assumirá a formatação da classe passada
        // um exemplo abaixo:
        p4.classList.add('ClasseCss');
        // como não existe essa classe css no arquivo html ou arquivo css vinculado
        // esse comando não terá efeito
        // E para remover uma classe css, é o mesmo processo, porém dessa vez a propriedade classList
        // acessar a propriedade remove
        // um exemplo abaixo:
        p4.classList.remove('ClasseCss');
        // lembre-se que é possível ainda usar o método setAttribute
        // passando o atributo style e seu valor, um exemplo abaixo:
        const p5 = document.getElementById('par5');
        p5.setAttribute("style", "color: blue;")
        // para saber mais sobre o método setAttribute, bastar verificar o código um pouco mais acima
        // desse arquivo
        
    </script>
</body>
</html>
